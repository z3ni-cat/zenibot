<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeniBot Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login-view" class="center hidden">
  <div class="card login-card">
    <h1>🤖 ZeniBot Admin</h1>
    <div id="setup-form" class="hidden">
      <div class="warn">Panel belum punya password — buat sekarang (sekali saja).</div>
      <input id="stoken" placeholder="Token setup dari Fein" autocomplete="off">
      <input type="password" id="spw" placeholder="Password baru (min 6 karakter)" autocomplete="new-password">
      <input type="password" id="spw2" placeholder="Ulangi password" autocomplete="new-password">
      <button class="btn primary" onclick="doSetup()">Buat password</button>
    </div>
    <div id="login-form">
      <p class="muted">Masuk untuk mengelola toko</p>
      <input type="password" id="pw" placeholder="Password admin" autocomplete="current-password">
      <button class="btn primary" onclick="doLogin()">Masuk</button>
    </div>
    <div id="login-err" class="err hidden"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">🤖 ZeniBot Admin</div>
    <button class="btn small" onclick="doLogout()">Keluar</button>
  </header>
  <nav id="tabs">
    <button data-tab="dash" class="active" onclick="showTab('dash')">📊 Dashboard</button>
    <button data-tab="produk" onclick="showTab('produk')">🛍️ Produk</button>
    <button data-tab="kategori" onclick="showTab('kategori')">📁 Kategori</button>
    <button data-tab="orders" onclick="showTab('orders')">🧾 Orders</button>
  </nav>
  <main>
    <section id="tab-dash" class="tab">
      <div class="stats" id="stats"></div>
      <h3>Order terbaru</h3>
      <div id="recent-orders" class="list"></div>
    </section>
    <section id="tab-produk" class="tab hidden">
      <div class="toolbar">
        <input id="pq" placeholder="🔍 Cari produk..." oninput="loadProducts()">
        <select id="pcat" onchange="loadProducts()"><option value="">Semua kategori</option></select>
        <button class="btn primary" onclick="openProductModal()">+ Produk</button>
      </div>
      <div id="product-grid" class="grid"></div>
    </section>
    <section id="tab-kategori" class="tab hidden">
      <button class="btn primary" onclick="openCategoryModal()">+ Kategori</button>
      <div id="cat-list" class="list" style="margin-top:12px"></div>
    </section>
    <section id="tab-orders" class="tab hidden">
      <div class="toolbar">
        <select id="ostatus" onchange="loadOrders()">
          <option value="">Semua status</option>
          <option value="paid">paid</option>
          <option value="expired">expired</option>
          <option value="pending">pending</option>
        </select>
      </div>
      <div id="order-list" class="list"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modal-body"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
